name: loong64
on:
  push:
    branches:
      - loong64/*
    tags:
      - release-loong64/*/*
  pull_request:
    branches:
      - loong64/*

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract etcd branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          ETCD_BRANCH=$(echo $REF | awk -F'/' '{print $2}')
          echo "ETCD_BRANCH=$ETCD_BRANCH"
          echo "ETCD_BRANCH=$ETCD_BRANCH" >> ${GITHUB_ENV}
      - name: Extract CPU architecture
        run: |
          KUBE_CPU_ARCH="${KUBE_BUILD_PLATFORMS##*/}"
          echo "KUBE_CPU_ARCH=$KUBE_CPU_ARCH"
          echo "KUBE_CPU_ARCH=$KUBE_CPU_ARCH" >> ${GITHUB_ENV}
      - name: Clone etcd
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: etcd-io/etcd
          ref: ${{ env.ETCD_BRANCH }}
          path: etcd
      - name: ls
        run: ls -lah
      - name: Apply patches
        working-directory: etcd
        run: git apply ../*.patch
      - name: Build etcd
        working-directory: etcd
        run: make
