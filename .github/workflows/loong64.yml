name: loong64
on:
  push:
    branches:
      - loong64/*
    tags:
      - release-loong64/*/*
  pull_request:
    branches:
      - loong64/*

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    permissions:
      contents: read
    env:
      GOOS: linux
      GOARCH: loong64
      ETCD_TAG: ${{ vars.ETCD_TAG || 'xuxiaoweicomcn/etcd-loong64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract etcd branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          ETCD_BRANCH=$(echo $REF | awk -F'/' '{print $2}')
          echo "ETCD_BRANCH=$ETCD_BRANCH"
          echo "ETCD_BRANCH=$ETCD_BRANCH" >> ${GITHUB_ENV}
      - name: Extract CPU architecture
        run: |
          KUBE_CPU_ARCH="${KUBE_BUILD_PLATFORMS##*/}"
          echo "KUBE_CPU_ARCH=$KUBE_CPU_ARCH"
          echo "KUBE_CPU_ARCH=$KUBE_CPU_ARCH" >> ${GITHUB_ENV}
      - name: Clone etcd
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: etcd-io/etcd
          ref: ${{ env.ETCD_BRANCH }}
          path: etcd
      - name: ls
        run: ls -lah
      - name: Install build tools
        run: |
          apt update
          apt install -y git make golang file
      - name: Install Docker CLI
        run: |
          apt remove $(dpkg --get-selections docker.io docker-compose docker-doc podman-docker containerd runc | cut -f1)
          apt update
          apt install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          # Add the repository to Apt sources:
          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt update
          apt install -y docker-ce-cli
      - name: Verify Docker installation
        run: |
          ls -la /run/docker.sock 2>/dev/null || echo "/run/docker.sock not found"
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker info
      - name: Apply patches
        working-directory: etcd
        run: git apply ../*.patch
      - name: Build etcd
        working-directory: etcd
        run: make
      - name: Print binary SHA-256 checksums
        working-directory: etcd
        run: |
          find bin -type f | xargs sha256sum
      - name: Inspect binary file types
        working-directory: etcd
        run: |
          echo "=== bin ==="
          file bin/*
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etcd-loong64-binaries
          path: |
            etcd/bin/*
      - name: Build Docker image
        working-directory: etcd
        env:
          TAG: ${{ env.ETCD_TAG }}
          BINARYDIR: ./bin
        run: |
          docker images
          ./scripts/build-docker.sh $ETCD_BRANCH
          docker images
