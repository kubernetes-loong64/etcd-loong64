name: loong64
on:
  push:
    branches:
      - loong64-*
    tags:
      - release-loong64-*
  pull_request:
    branches:
      - loong64-*

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    permissions:
      contents: read
    env:
      GOOS: linux
      GOARCH: loong64
      ETCD_IMAGE: ${{ vars.ETCD_IMAGE || 'kubernetesloong64/etcd-loong64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract etcd branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          echo "REF=$REF"
          PROJECT_ETCD_VERSION=$(echo $REF | awk -F'loong64-' '{print $2}')
          echo "PROJECT_ETCD_VERSION=$PROJECT_ETCD_VERSION"
          ETCD_BRANCH=$(echo $PROJECT_ETCD_VERSION | sed 's/+.*//')
          echo "ETCD_BRANCH=$ETCD_BRANCH"
          echo "ETCD_BRANCH=$ETCD_BRANCH" >> ${GITHUB_ENV}
          ETCD_DOCKER_TAG=$(echo $PROJECT_ETCD_VERSION | sed 's/+/-/g')
          echo "ETCD_DOCKER_TAG=$ETCD_DOCKER_TAG"
          echo "ETCD_DOCKER_TAG=$ETCD_DOCKER_TAG" >> ${GITHUB_ENV}
      - name: Clone etcd
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: etcd-io/etcd
          ref: ${{ env.ETCD_BRANCH }}
          path: etcd
      - name: ls
        run: ls -lah
      - name: Install build tools
        run: |
          apt update
          apt install -y git make golang file jq
      - name: Install Docker CLI
        run: |
          apt remove $(dpkg --get-selections docker.io docker-compose docker-doc podman-docker containerd runc | cut -f1)
          apt update
          apt install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          # Add the repository to Apt sources:
          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt update
          apt install -y docker-ce-cli
      - name: Verify Docker installation
        run: |
          ls -la /run/docker.sock 2>/dev/null || echo "/run/docker.sock not found"
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker info
      - name: Apply patches
        working-directory: etcd
        run: git apply ../*.patch
      - name: Build etcd
        working-directory: etcd
        run: make
      - name: Print binary SHA-256 checksums
        working-directory: etcd
        run: |
          find bin -type f | xargs sha256sum
      - name: Inspect binary file types
        working-directory: etcd
        run: |
          echo "=== bin ==="
          file bin/*
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etcd-loong64-binaries
          path: |
            etcd/bin/*
      - name: Build Docker image
        working-directory: etcd
        env:
          TAG: ${{ env.ETCD_IMAGE }}
          BINARYDIR: ./bin
        run: |
          docker images
          ./scripts/build-docker.sh $ETCD_DOCKER_TAG
          docker images
          docker save -o etcd-loong64.tar $(docker images ${{ env.ETCD_IMAGE }} --format "{{.ID}}")
          ls -lha
          tar -xOf etcd-loong64.tar index.json || tar -xOf etcd-loong64.tar manifest.json | jq
      - name: Upload container images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etcd-loong64-images
          path: |
            etcd/etcd-loong64.tar

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: etcd-loong64-binaries
          path: loong64-artifacts
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: etcd-loong64-images
          path: loong64-artifacts
      - name: List downloaded files
        run: find . -type f
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY_BASE64 }}" | base64 -d | gpg --batch --import > /dev/null
          echo "$(gpg --list-secret-keys --keyid-format LONG | grep -Eo '[A-F0-9]{40}' | head -1):6:" | gpg --import-ownertrust
      - name: Sign artifacts
        run: |
          find loong64-artifacts -type f | while read -r file; do
            gpg --detach-sign --armor "$file"
            echo "Signed: $file"
            gpg --verify "$file".asc "$file"
          done
      - name: Package signatures
        run: |
          mkdir signatures
          find loong64-artifacts -name '*.asc' -exec mv {} signatures \;
          find signatures -name '*.asc' | tar -czf loong64-artifacts/signatures.tar.gz -T -
      - name: List Release files
        run: find loong64-artifacts -type f
      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: ${{ github.ref_name }}
          files: |
            loong64-artifacts/**
